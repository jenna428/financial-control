<div class="d-flex flex-column">
    <app-variable-expenditure-form
        action="create" (onSubmit)="load()">
    </app-variable-expenditure-form>

    <div class="mx-auto w-50">
        <div class="d-flex justify-content-between">
            <mat-checkbox class="mb-4"
                [checked]="showSelection"
                (change)="toggleSelection()">
                Selecionar
            </mat-checkbox>
            <button type="button" class="btn btn-light d-flex justify-content-center align-items-center m-2 p-2" *ngIf="showSelection">
                <span matTooltip="Mover para Lixeira" class="material-symbols-outlined">
                    delete
                </span>
            </button>
        </div>

        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

            <ng-container matColumnDef="select" *ngIf="showSelection">
                <div>
                    <th mat-header-cell *matHeaderCellDef>
                        <mat-checkbox class="allSelect"
                            [checked]="isAllSelected()"
                            [indeterminate]="isSomeSelected()"
                            (change)="toggleAll($event.checked)">
                        </mat-checkbox>
                    </th>
                    <td mat-cell *matCellDef="let element">
                        <mat-checkbox class="checkbox"
                            [checked]="element.selected"
                            (change)="element.selected = $event.checked">
                        </mat-checkbox>
                    </td>
                </div>
            </ng-container>

            <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let element">
                <div class="d-flex align-items-center">
                    {{element.name}}
                    <div class="d-flex ms-auto">
                        <button type="button" class="btn btn-light d-flex justify-content-center align-items-center m-2 p-2" (click)="openUpdateDialog(element)">
                            <span matTooltip="Editar" class="material-symbols-outlined">
                                edit
                            </span>
                        </button>
                        <button type="button" class="btn btn-light d-flex justify-content-center align-items-center m-2 p-2" (click)="moveToTrash(element.id)">
                            <span matTooltip="Mover para Lixeira" class="material-symbols-outlined">
                                delete
                            </span>
                        </button>
                    </div>
                </div>
            </td>
            </ng-container>
    
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator #paginator
            (page)="handlePageEvent($event)"
            [length]="length"
            [pageSize]="pageSize"
            [hidePageSize]="hidePageSize"
            [pageIndex]="pageIndex"
            aria-label="Select page">

        </mat-paginator>
    </div>
</div>
