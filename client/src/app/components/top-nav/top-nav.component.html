<div class="top-nav-container d-flex align-items-center justify-content-between">
    <div class="header">
        <div class="d-flex align-items-center h-100 p-0 ms-3">
            <button *ngIf="isMobile" type="button" class="menu-button d-flex justify-content-center align-items-center" (click)="toggleHiddenMenu()">
                <mat-icon class="d-flex justify-content-center align-items-center material-symbols-outlined">{{hiddenMenu ? 'menu' : 'close'}}</mat-icon>
            </button>
            <mat-icon class="overflow-visible d-flex align-items-center ms-3 mx-2">savings</mat-icon>
            <span class="fs-5">Pecunia</span>
        </div>
    </div>
    <div class="fs-3 me-4">
        <button mat-icon-button (click)="logout()" class="d-flex justify-content-center align-items-center" >
            <mat-icon class="overflow-visible fs-6">logout</mat-icon>
        </button>
    </div>
</div>
