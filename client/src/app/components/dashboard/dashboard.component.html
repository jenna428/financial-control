<div class="page d-flex justify-content-center flex-column">
    <div class="d-flex justify-content-center mb-3">
        <h1>{{currentMonth | month}} / {{currentYear}}</h1>
    </div>

    <div class="w-100 p-3">
        <mat-list class="mobile-table">
            <mat-list-item>
                <div matListItemTitle>Receita</div>
                <div matListItemLine>{{status.totalIncome | currency}}</div>
            </mat-list-item>
            <mat-list-item>
                <div matListItemTitle>Despesa</div>
                <div matListItemLine>{{status.totalExpenditure | currency}}</div>
            </mat-list-item>
            <mat-list-item>
                <div matListItemTitle>Saldo</div>
                <div matListItemLine>{{status.finalBalance | currency}}</div>
            </mat-list-item>
        </mat-list>
    </div>
    <div class="d-flex" [ngClass]="{'flex-column': isMobile}">
        <div echarts [ngStyle]=" isMobile ? {'width': '350px', 'height': '250px'} : {}"  [options]="pieOption" class="pieChart m-3"></div>
        <div echarts [ngStyle]=" isMobile ? {'width': '350px', 'height': '250px'} : {}" [options]="barOption" class="barChart m-3"></div>
    </div>
</div>
